[project]
name = "sift"
version = "0.1.0"
description = "sift — a non-LLM semantic sandbox that classifies agent actions good/bad (embeddings + structural taint), a drop-in alternative to the ddbt LLM judge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anirudh Gupta" }]
# core runs OFFLINE: numpy + scikit-learn cover the hashing encoder and methods 1,2,3,6,7.
dependencies = ["numpy>=1.26", "scikit-learn>=1.4"]

[project.optional-dependencies]
# The DEPLOYED encoder: potion-base-32M static embeddings. Inference is a token→vector lookup
# (numpy + safetensors) — NO PyTorch. This is all `ddbt prepare` and the runtime judge need.
embed = ["model2vec>=0.3"]
# EXPERIMENTAL ONLY (bake-off / distillation). These pull PyTorch via sentence-transformers and
# model2vec[train] — NOT needed for the deployed model2vec fusion judge. Install only to reproduce
# the encoder bake-off or distill a new static model.
experimental = ["sentence-transformers>=3.0", "model2vec[train]>=0.3", "datasets>=2.19", "accelerate>=1.1"]
finetune = ["sentence-transformers>=3.0", "model2vec[train]>=0.3"]   # alias, kept for older scripts

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sift"]

[tool.hatch.metadata]
allow-direct-references = true
