[project]
name = "ddbt-agent"
version = "0.1.0"
description = "Don't Do Bad Things — an envelope-anchored, privilege-separated sandbox for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anirudh Gupta" }]
dependencies = []

[project.optional-dependencies]
judge = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
bench = ["agentdojo"]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6"]

[project.scripts]
ddbt = "ddbt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddbt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
