[project]
name = "ddbt-agent"
version = "0.1.0"
description = "Don't Do Bad Things — an envelope-anchored, privilege-separated sandbox for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anirudh Gupta" }]
# Core = the DEFAULT sift decider's runtime (torch-free: model2vec inference is numpy+safetensors)
# plus anthropic for the flagged LLM fallback. So `ddbt`, the hook, and the demos all run sift with
# no extra install. `ddbt prepare` builds the model; editing ddbt.json `behaviors` needs no training.
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "model2vec>=0.3",
    "joblib>=1.3",
    "anthropic>=0.40", # flagged LLM fallback (DDBT_JUDGE=llm)
    "pytest>=9.1.0",
    "presidio>=2.2.364",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
# the pii_dlp plugin uses Presidio for validated PII detection on egress; without it, the plugin
# falls back to a built-in regex detector, so this is optional.
pii = ["presidio-analyzer>=2.2"]
# alternative judge backend — same prompts/schema, so runs are comparable across providers
gemini = ["google-genai>=1.0"]
bench = ["agentdojo"]
# AgentDyn is a hard fork of AgentDojo published under the SAME `agentdojo` import name,
# so installing it REPLACES the upstream `bench` agentdojo — use one or the other env.
# It adds the shopping/github/dailylife suites and keeps the originals.
agentdyn = ["agentdojo @ git+https://github.com/leolee99/AgentDyn.git"]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6"]

[project.scripts]
ddbt = "ddbt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# the `agentdyn` extra installs AgentDyn via a direct git reference (it has no PyPI release)
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ddbt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "hypothesis",
    "pytest",
    "pytest-cov",
]
